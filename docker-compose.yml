# RXCluster docker-compose.
#
# The reference design keeps all state in memory, so the application runs as a
# single service with no external dependencies. Optional sidecar services
# (Redis, Prometheus, Grafana) are included but commented out; enable them only
# if you need shared caching, long-term metrics or dashboards.

services:
  rxcluster:
    build: .
    image: rxcluster:latest
    container_name: rxcluster
    restart: unless-stopped
    ports:
      - "7300:7300"   # Telnet to N1MM Logger+
      - "8080:8080"   # health / metrics
    volumes:
      # Local configuration (may contain callsigns/passwords).
      - ./config/rxcluster.yaml:/app/config/rxcluster.yaml:ro
      # Persistent reference data (SCP, cty.dat, patt3ch.lst).
      - ./data:/app/data
      # Per-callsign settings (separate volume so it stays writable even when
      # the reference-data bind mount is owned by another user).
      - rxcluster-users:/app/data/users
      # Logs.
      - ./logs:/var/log/rxcluster
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3).status==200 else 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

