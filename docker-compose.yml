# RXCluster docker-compose.
#
# The reference design keeps all state in memory, so the application runs as a
# single service with no external dependencies. Optional sidecar services
# (Redis, Prometheus, Grafana) are included but commented out; enable them only
# if you need shared caching, long-term metrics or dashboards.
#
# The image is built straight from git (see the build args). All mutable state
# stays inside this project directory through relative bind mounts, so rebuilding
# or upgrading the image keeps your configuration, reference data, users and
# logs.

services:
  rxcluster:
    build:
      context: .
      args:
        RXCLUSTER_REPO: https://github.com/sq3rx/RXCluster.git
        RXCLUSTER_REF: master
    image: rxcluster:latest
    container_name: rxcluster
    restart: unless-stopped
    # Run as the host user (set PUID/PGID in .env) so the bind-mounted files are
    # owned by you and no sudo is needed to edit the configuration.
    user: "${PUID:-1000}:${PGID:-1000}"
    ports:
      - "7300:7300"   # Telnet to N1MM Logger+
      - "8080:8080"   # health / metrics
    volumes:
      # Configuration (may contain callsigns/passwords). Seeded from the bundled
      # example on first start and preserved across image upgrades.
      - ./config:/app/config
      # Persistent reference data (SCP, cty.dat, patt3ch.lst) and per-callsign
      # settings under data/users/.
      - ./data:/app/data
      # Logs (used when logging.file is set in the configuration).
      - ./logs:/var/log/rxcluster
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3).status==200 else 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

